name: Android CI/CD (Debug)

on:
  push:
    branches: [Feature]
  pull_request:
    branches: [Feature]

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK (needed for Gradle)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      # 3. Set up Node.js (React Native requires Node + Yarn)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: "yarn"

      # 4. Install JS dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 5. Restore Gradle cache (to speed up builds)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 6. Build unsigned debug APK (no secrets required)
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug

      # 7. Upload APK as artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
