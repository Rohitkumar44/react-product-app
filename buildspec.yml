version: 0.2

env:
  variables:
    ACCOUNT_ID: 026090545815
    REGION: us-east-1
    FRONTEND_REPO: projectfront
    BACKEND_REPO: projectback
    FRONTEND_DIR: frontend
    BACKEND_DIR: backend
    K8S_MANIFEST_DIR: k8s

phases:
  install:
    runtime-versions:
      nodejs: 18
      java: corretto17
    commands:
      - echo Installing Docker...
      - nohup /usr/local/bin/dockerd-entrypoint.sh &>/tmp/dockerd.log &
      - timeout 15 sh -c "until docker info; do echo .; sleep 1; done"
      - echo Docker is ready.

      - echo Installing kubectl...
      - curl -LO "https://dl.k8s.io/release/v1.29.1/bin/linux/amd64/kubectl"
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/
      - kubectl version --client


  pre_build:
    commands:
      - echo Setting dynamic image tag...
      - export IMAGE_TAG=v1.${CODEBUILD_BUILD_NUMBER}
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 026090545815.dkr.ecr.us-east-1.amazonaws.com
     
      - echo Installing SonarQube Scanner...
      - curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
      - unzip -q sonar-scanner.zip
      - export PATH=$PATH:$(pwd)/sonar-scanner-4.8.0.2856-linux/bin
     
      - echo Configuring kubeconfig for EKS...
      - aws eks update-kubeconfig --region us-east-1 --name project-cluster
      - echo Installing frontend and backend dependencies...
      
      - echo Installing Trivy...
      - wget https://github.com/aquasecurity/trivy/releases/download/v0.63.0/trivy_0.63.0_Linux-64bit.tar.gz
      - tar -xzf trivy_0.63.0_Linux-64bit.tar.gz
      - mv trivy /usr/local/bin/
      - trivy --version

      - echo Build started on `date`
      - echo Compiling the application...
      - mvn clean package -DskipTests

      - cd $FRONTEND_DIR && npm install && cd -
      - cd $BACKEND_DIR && npm install && cd -

  build:
    commands:
       - echo Running SonarQube Analysis...
       - |
         set +e
         sonar-scanner \
           -Dsonar.projectKey=New_Capstone \
           -Dsonar.sources=. \
           -Dsonar.java.binaries=target/classes \
           -Dsonar.host.url=http://52.87.101.241:9000 \
           -Dsonar.login=sqp_39d1f3d9519e997ef336a9887f58a289df734506 || echo "SonarQube analysis failed, continuing..."
        set -e
      - echo Building Docker images...
      - docker build -t $FRONTEND_REPO:$IMAGE_TAG $FRONTEND_DIR
      - docker tag $FRONTEND_REPO:$IMAGE_TAG 026090545815.dkr.ecr.us-east-1.amazonaws.com/$FRONTEND_REPO:$IMAGE_TAG
      - docker build -t $BACKEND_REPO:$IMAGE_TAG $BACKEND_DIR
      - docker tag $BACKEND_REPO:$IMAGE_TAG 026090545815.dkr.ecr.us-east-1.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing Docker images to ECR...
      - docker push 026090545815.dkr.ecr.us-east-1.amazonaws.com/$FRONTEND_REPO:$IMAGE_TAG
      - docker push 026090545815.dkr.ecr.us-east-1.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG

      - echo Preparing Kubernetes manifest output directory...
      - mkdir -p k8s-out

      # --- FRONTEND ---
      - sed "s|IMAGE_PLACEHOLDER|public.ecr.aws/$Alias/$FRONTEND_REPO:$IMAGE_TAG|g" $K8S_MANIFEST_DIR/frontend/deployment.yaml > k8s-out/frontend-deployment.yaml
      - cp $K8S_MANIFEST_DIR/frontend/service.yaml k8s-out/frontend-service.yaml

      # --- BACKEND ---
      - sed "s|IMAGE_PLACEHOLDER|public.ecr.aws/$Alias/$BACKEND_REPO:$IMAGE_TAG|g" $K8S_MANIFEST_DIR/backend/deployment.yaml > k8s-out/backend-deployment.yaml
      - cp $K8S_MANIFEST_DIR/backend/service.yaml k8s-out/backend-service.yaml

      # --- DATABASE ---
      - cp $K8S_MANIFEST_DIR/database/deployment.yaml k8s-out/database-deployment.yaml || true
      - cp $K8S_MANIFEST_DIR/database/service.yaml k8s-out/database-service.yaml || true
      - cp $K8S_MANIFEST_DIR/Database/secrets.yaml k8s-out/database-secrets.yaml || true

      # --- INGRESS ---
      - cp $K8S_MANIFEST_DIR/ingress.yaml k8s-out/ingress.yaml || true

      # --- DEBUG ---
      - echo "Final list of generated Kubernetes YAML files:"
      - find k8s-out/

artifacts:
  base-directory: k8s-out
  discard-paths: yes
  files:
    - '**/*.yaml'

cache:
  paths:
    - 'frontend/node_modules/**/*'
    - 'backend/node_modules/**/*'
